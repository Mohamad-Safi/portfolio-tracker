spring.application.name=portfolio-tracker
spring.profiles.active=local
spring.datasource.url=jdbc:mysql://localhost:3306/portfolioDB?
serverTimezone=Europe/London&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Twelve Data: the real key goes in application-local.properties
twelvedata.base-url=https://api.twelvedata.com
twelvedata.api-key=
pricing.cache-minutes=15
# Login session: ends after 30 idle minutes, cookie hidden from JavaScript,
not sent on cross-site posts
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax