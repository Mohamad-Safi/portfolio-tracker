<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <div class="logo">Portfolio Tracker</div>

    <!-- Main navigation: the app's pages -->
    <nav class="top-navigation">
        <a href="#" id="homeButton">Home</a>
        <a href="#" id="portfolioButton">Portfolio</a>
        <a href="#" id="holdingsButton">Holdings</a>
        <a href="#" id="stocksButton">Stocks</a>
        <a href="#" id="watchlistButton">Watchlist</a>
        <a href="#" id="transactionsButton">Transactions</a>
    </nav>

    <!-- Account links: which ones show depends on whether you're logged in -->
    <div class="account-navigation">
        <span id="currentUser" class="current-user"></span>
        <div class="login"><a href="#" id="profileButton">Profile</a></div>
        <div class="login"><a href="#" id="registerButton">Register</a></div>
        <div class="login"><a href="#" id="loginButton">Login</a></div>
        <div class="login"><a href="#" id="logoutButton">Logout</a></div>
    </div>
</header>

<main class="main-content">
    <!-- Messages (success / error) for every section appear here -->
    <p id="message" class="message"></p>
    <!-- Each section's content is drawn in here by its own JS file -->
    <div id="main"></div>
</main>

<!-- jQuery first, then the shared app.js, then one file per section -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/home.js"></script>
<script src="/js/portfolio.js"></script>
<script src="/js/stocks.js"></script>
<script src="/js/holdings.js"></script>
<script src="/js/watchlist.js"></script>
<script src="/js/transactions.js"></script>
</body>
</html>
